services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/vaynexo.db
    volumes:
      - vaynexo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: ["python", "-m", "apps.bot.main"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/vaynexo.db
    volumes:
      - vaynexo-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  vaynexo-data:
